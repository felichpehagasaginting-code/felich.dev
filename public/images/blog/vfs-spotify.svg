<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark mode gradient background -->
  <rect width="1200" height="630" fill="#0A0A0C"/>
  <circle cx="150" cy="150" r="300" fill="#1DB954" opacity="0.1" filter="blur(80px)"/>
  <circle cx="1050" cy="480" r="300" fill="#10B981" opacity="0.1" filter="blur(80px)"/>
  <circle cx="600" cy="315" r="250" fill="#3B82F6" opacity="0.05" filter="blur(100px)"/>

  <!-- Terminal + Spotify Graphic -->
  <g transform="translate(600, 130)">
    <rect x="-170" y="-60" width="340" height="150" rx="16" fill="#151518" stroke="#33333C" stroke-width="2"/>
    <circle cx="-140" cy="-30" r="6" fill="#FF5F57"/>
    <circle cx="-120" cy="-30" r="6" fill="#FEBC2E"/>
    <circle cx="-100" cy="-30" r="6" fill="#28C840"/>
    <text x="-140" y="15" font-family="monospace" font-size="14" fill="#10B981">➜ ~ whoami</text>
    <text x="-140" y="45" font-family="monospace" font-size="14" fill="#888899">Felich - Software Engineer</text>
    <text x="-140" y="75" font-family="monospace" font-size="14" fill="#888899">➜ ~ now-playing --live</text>
    <!-- Equalizer bars -->
    <rect x="120" y="5" width="6" height="14" rx="2" fill="#1DB954"/>
    <rect x="132" y="-5" width="6" height="24" rx="2" fill="#1DB954" opacity="0.85"/>
    <rect x="144" y="1" width="6" height="18" rx="2" fill="#1DB954" opacity="0.7"/>
    <rect x="156" y="-9" width="6" height="28" rx="2" fill="#1DB954" opacity="0.95"/>
    <rect x="168" y="3" width="6" height="16" rx="2" fill="#1DB954" opacity="0.6"/>
  </g>

  <!-- Title & Subtitle inside image -->
  <text x="600" y="385" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" text-anchor="middle" letter-spacing="-1">VIRTUAL SHELL &amp; SPOTIFY API</text>
  <text x="600" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="20" fill="#888899" text-anchor="middle" letter-spacing="4">VFS TERMINAL &bull; LIVE NOW-PLAYING &bull; i18n</text>

  <!-- Left Side: VFS Terminal -->
  <g transform="translate(100, 200)">
    <rect width="300" height="180" rx="20" fill="#151518" stroke="#33333C" stroke-width="2"/>
    <text x="30" y="45" font-family="monospace" font-size="12" fill="#888899" letter-spacing="1">VIRTUAL FILE SYSTEM</text>
    <text x="30" y="100" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="42" fill="#3B82F6">zsh</text>
    <text x="30" y="135" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="14" fill="#888899">Stateful Command Shell</text>
    <rect x="30" y="150" width="240" height="4" rx="2" fill="#222227"/>
    <rect x="30" y="150" width="240" height="4" rx="2" fill="#3B82F6"/>
  </g>

  <!-- Right Side: Spotify Sync -->
  <g transform="translate(800, 200)">
    <rect width="300" height="180" rx="20" fill="#151518" stroke="#33333C" stroke-width="2"/>
    <text x="30" y="45" font-family="monospace" font-size="12" fill="#888899" letter-spacing="1">LIVE SYNC</text>
    <text x="30" y="100" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="42" fill="#1DB954">Live</text>
    <text x="30" y="135" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="14" fill="#888899">Real Spotify Now-Playing</text>
    <rect x="30" y="150" width="240" height="4" rx="2" fill="#222227"/>
    <rect x="30" y="150" width="240" height="4" rx="2" fill="#1DB954"/>
  </g>
</svg>