<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark mode gradient background -->
  <rect width="1200" height="630" fill="#0A0A0C"/>
  <circle cx="150" cy="150" r="300" fill="#3B82F6" opacity="0.1" filter="blur(80px)"/>
  <circle cx="1050" cy="480" r="300" fill="#8B5CF6" opacity="0.1" filter="blur(80px)"/>
  <circle cx="600" cy="315" r="250" fill="#10B981" opacity="0.05" filter="blur(100px)"/>

  <!-- Auth Shield Graphic -->
  <g transform="translate(600, 165)">
    <circle cx="0" cy="0" r="55" fill="#8B5CF6" opacity="0.12"/>
    <path d="M0 -45 L38 -30 L38 8 C38 32 22 50 0 60 C-22 50 -38 32 -38 8 L-38 -30 Z" fill="#8B5CF6" opacity="0.18" stroke="#8B5CF6" stroke-width="2.5"/>
    <path d="M-16 2 L-5 13 L17 -11" stroke="#C4B5FD" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="0" cy="18" r="4" fill="#F59E0B"/>
  </g>

  <!-- Title & Subtitle inside image -->
  <text x="600" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" text-anchor="middle" letter-spacing="-1">SECURING THE GUESTBOOK</text>
  <text x="600" y="395" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="20" fill="#888899" text-anchor="middle" letter-spacing="4">FIREBASE AUTH &bull; GOOGLE OAuth &bull; FIREWALL RULES</text>

  <!-- Left Side: Auth Providers -->
  <g transform="translate(100, 200)">
    <rect width="300" height="180" rx="20" fill="#151518" stroke="#33333C" stroke-width="2"/>
    <text x="30" y="45" font-family="monospace" font-size="12" fill="#888899" letter-spacing="1">AUTH PROVIDERS</text>
    <text x="30" y="100" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="42" fill="#8B5CF6">OAuth</text>
    <text x="30" y="135" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="14" fill="#888899">Google Sign-In / Real Avatars</text>
    <rect x="30" y="150" width="240" height="4" rx="2" fill="#222227"/>
    <rect x="30" y="150" width="240" height="4" rx="2" fill="#8B5CF6"/>
  </g>

  <!-- Right Side: Rate Limiting -->
  <g transform="translate(800, 200)">
    <rect width="300" height="180" rx="20" fill="#151518" stroke="#33333C" stroke-width="2"/>
    <text x="30" y="45" font-family="monospace" font-size="12" fill="#888899" letter-spacing="1">SPAM DEFENSE</text>
    <text x="30" y="100" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="42" fill="#10B981">RL</text>
    <text x="30" y="135" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="14" fill="#888899">Client-Side Rate Limiter</text>
    <rect x="30" y="150" width="240" height="4" rx="2" fill="#222227"/>
    <rect x="30" y="150" width="240" height="4" rx="2" fill="#10B981"/>
  </g>
</svg>