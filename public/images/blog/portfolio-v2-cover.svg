<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient background -->
  <rect width="1200" height="630" fill="#0A0A0E"/>
  
  <!-- Subtle theme ambient blurs (Matcha, Noir Silver, Lavender) -->
  <circle cx="200" cy="200" r="320" fill="#6B881F" opacity="0.15" filter="blur(90px)"/>
  <circle cx="1000" cy="450" r="320" fill="#7C6FC4" opacity="0.15" filter="blur(90px)"/>
  <circle cx="600" cy="315" r="280" fill="#CDCDD6" opacity="0.08" filter="blur(110px)"/>

  <!-- Grid overlay -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Center Graphic: Tri-Theme Motion Rings -->
  <g transform="translate(600, 175)">
    <!-- Outer Lavender Glow Ring -->
    <circle cx="0" cy="0" r="58" stroke="#7C6FC4" stroke-width="2" stroke-dasharray="8 6" opacity="0.8"/>
    <!-- Middle Matcha Ring -->
    <circle cx="0" cy="0" r="42" stroke="#6B881F" stroke-width="3" opacity="0.9"/>
    <!-- Inner Noir Core -->
    <circle cx="0" cy="0" r="26" fill="#202025" stroke="#CDCDD6" stroke-width="2"/>
    
    <!-- Motion Spark / Play Icon -->
    <path d="M-5 -10 L10 0 L-5 10 Z" fill="#6B881F"/>
  </g>

  <!-- Title & Subtitle inside image -->
  <text x="600" y="320" font-family="'Poppins', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="42" fill="#F5F5F6" text-anchor="middle" letter-spacing="-0.5">PORTFOLIO V2.5: GSAP INTRO &amp; PERF OVERHAUL</text>
  <text x="600" y="365" font-family="'Poppins', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="500" font-size="18" fill="#A6A6AC" text-anchor="middle" letter-spacing="3">CHROMATIC MOTION &bull; 0MS DEV SW &bull; WEB VITALS OPTIMIZATION</text>

  <!-- Feature Cards on Bottom/Sides -->
  <!-- Card 1: GSAP Chromatic Intro -->
  <g transform="translate(140, 420)">
    <rect width="280" height="130" rx="16" fill="#15151A" stroke="rgba(107, 136, 31, 0.3)" stroke-width="1.5"/>
    <text x="24" y="38" font-family="'Poppins', sans-serif" font-size="11" font-weight="700" fill="#6B881F" letter-spacing="1">THEME JOURNEY</text>
    <text x="24" y="70" font-family="'Poppins', sans-serif" font-weight="800" font-size="22" fill="#F5F5F6">GSAP + Lenis</text>
    <text x="24" y="98" font-family="'Poppins', sans-serif" font-size="13" fill="#A6A6AC">Matcha → Noir → Lavender</text>
  </g>

  <!-- Card 2: Web Vitals -->
  <g transform="translate(460, 420)">
    <rect width="280" height="130" rx="16" fill="#15151A" stroke="rgba(205, 205, 214, 0.25)" stroke-width="1.5"/>
    <text x="24" y="38" font-family="'Poppins', sans-serif" font-size="11" font-weight="700" fill="#CDCDD6" letter-spacing="1">CORE WEB VITALS</text>
    <text x="24" y="70" font-family="'Poppins', sans-serif" font-weight="800" font-size="22" fill="#4ADE80">-3.1s LCP Delay</text>
    <text x="24" y="98" font-family="'Poppins', sans-serif" font-size="13" fill="#A6A6AC">Zero Render-Blocking</text>
  </g>

  <!-- Card 3: UI System -->
  <g transform="translate(780, 420)">
    <rect width="280" height="130" rx="16" fill="#15151A" stroke="rgba(124, 111, 196, 0.3)" stroke-width="1.5"/>
    <text x="24" y="38" font-family="'Poppins', sans-serif" font-size="11" font-weight="700" fill="#7C6FC4" letter-spacing="1">UI &amp; REFINEMENT</text>
    <text x="24" y="70" font-family="'Poppins', sans-serif" font-weight="800" font-size="22" fill="#F5F5F6">Icon-Only Pills</text>
    <text x="24" y="98" font-family="'Poppins', sans-serif" font-size="13" fill="#A6A6AC">Vanilla Matcha Default</text>
  </g>
</svg>
