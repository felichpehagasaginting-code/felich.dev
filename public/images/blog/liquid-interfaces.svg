<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark mode gradient background -->
  <rect width="1200" height="630" fill="#0A0A0C"/>
  <circle cx="150" cy="150" r="300" fill="#06B6D4" opacity="0.1" filter="blur(80px)"/>
  <circle cx="1050" cy="480" r="300" fill="#8B5CF6" opacity="0.1" filter="blur(80px)"/>
  <circle cx="600" cy="315" r="250" fill="#EC4899" opacity="0.05" filter="blur(100px)"/>

  <!-- Liquid Glass Droplet Graphic -->
  <g transform="translate(600, 160)">
    <circle cx="-45" cy="0" r="32" fill="#06B6D4" opacity="0.25" filter="blur(2px)"/>
    <circle cx="45" cy="-10" r="28" fill="#8B5CF6" opacity="0.25" filter="blur(2px)"/>
    <path d="M0 -42 C36 -42 50 -20 50 0 C50 30 32 50 0 50 C-32 50 -50 30 -50 0 C-50 -20 -36 -42 0 -42 Z" fill="#FFFFFF" opacity="0.08" stroke="#A5B4FC" stroke-width="2.5"/>
    <ellipse cx="-14" cy="-14" rx="10" ry="6" fill="#FFFFFF" opacity="0.5" transform="rotate(-30 -14 -14)"/>
    <circle cx="0" cy="14" r="5" fill="#06B6D4" opacity="0.6"/>
    <circle cx="16" cy="-2" r="3" fill="#8B5CF6" opacity="0.7"/>
  </g>

  <!-- Title & Subtitle inside image -->
  <text x="600" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" text-anchor="middle" letter-spacing="-1">LIQUID INTERFACES</text>
  <text x="600" y="395" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="20" fill="#888899" text-anchor="middle" letter-spacing="4">GLASSMORPHISM &bull; FLUID PHYSICS &bull; DESIGN</text>

  <!-- Left Side: Glass Layers -->
  <g transform="translate(100, 200)">
    <rect width="300" height="180" rx="20" fill="#151518" stroke="#33333C" stroke-width="2"/>
    <text x="30" y="45" font-family="monospace" font-size="12" fill="#888899" letter-spacing="1">GLASS LAYERS</text>
    <rect x="30" y="70" width="240" height="46" rx="12" fill="#FFFFFF" opacity="0.06" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="30" y="86" width="240" height="30" rx="10" fill="#FFFFFF" opacity="0.1" stroke="#A5B4FC" stroke-width="1.5"/>
    <text x="30" y="170" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="14" fill="#888899">Backdrop Blur / Transparency</text>
  </g>

  <!-- Right Side: Fluid Physics -->
  <g transform="translate(800, 200)">
    <rect width="300" height="180" rx="20" fill="#151518" stroke="#33333C" stroke-width="2"/>
    <text x="30" y="45" font-family="monospace" font-size="12" fill="#888899" letter-spacing="1">FLUID PHYSICS</text>
    <path d="M30 150 Q80 80 130 120 T230 110" stroke="#06B6D4" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M30 150 Q80 60 130 100 T230 90" stroke="#8B5CF6" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.8"/>
    <text x="30" y="178" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="14" fill="#888899">Organic Motion / Easing</text>
  </g>
</svg>