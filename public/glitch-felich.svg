<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160" width="100%" height="160">
  <defs>
    <!-- Matcha Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@900&amp;display=swap');

    .glitch-text {
      font-family: 'JetBrains Mono', monospace, -apple-system, sans-serif;
      font-size: 68px;
      font-weight: 900;
      text-anchor: middle;
      dominant-baseline: middle;
      letter-spacing: 6px;
    }

    /* Main Matcha Olive Green Base Layer */
    .base {
      fill: #556B14;
      filter: drop-shadow(0 0 10px rgba(107, 136, 31, 0.45));
      animation: jitter 3s infinite ease-in-out;
    }

    /* Red/Coral RGB Glitch Split Layer */
    .glitch-red {
      fill: #B42318;
      opacity: 0.85;
      animation: glitch-anim-red 2.4s infinite cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    /* Light Sage Green RGB Glitch Split Layer */
    .glitch-blue {
      fill: #8AA82A;
      opacity: 0.85;
      animation: glitch-anim-blue 2.4s infinite cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    /* Subtitle Tagline */
    .sub-text {
      font-family: 'JetBrains Mono', monospace, sans-serif;
      font-size: 15px;
      font-weight: 700;
      fill: #55554E;
      text-anchor: middle;
      letter-spacing: 3px;
      animation: pulse-sub 3s infinite ease-in-out;
    }

    @keyframes jitter {
      0%, 85%, 100% { transform: translate(0, 0); }
      86% { transform: translate(-3px, 2px) skewX(1deg); }
      88% { transform: translate(3px, -1px) skewX(-2deg); }
      90% { transform: translate(-2px, -2px); }
      92% { transform: translate(2px, 1px); }
      94% { transform: translate(0, 0); }
    }

    @keyframes glitch-anim-red {
      0%, 82%, 100% {
        transform: translate(0, 0);
        clip-path: inset(0 0 0 0);
        opacity: 0;
      }
      83% {
        transform: translate(-6px, -2px);
        clip-path: inset(20% 0 50% 0);
        opacity: 0.9;
      }
      85% {
        transform: translate(7px, 3px);
        clip-path: inset(60% 0 10% 0);
        opacity: 0.9;
      }
      87% {
        transform: translate(-5px, 1px);
        clip-path: inset(10% 0 75% 0);
        opacity: 0.8;
      }
      89% {
        transform: translate(4px, -3px);
        clip-path: inset(40% 0 30% 0);
        opacity: 0.9;
      }
      91% {
        transform: translate(0, 0);
        clip-path: inset(0 0 0 0);
        opacity: 0;
      }
    }

    @keyframes glitch-anim-blue {
      0%, 82%, 100% {
        transform: translate(0, 0);
        clip-path: inset(0 0 0 0);
        opacity: 0;
      }
      84% {
        transform: translate(6px, 2px);
        clip-path: inset(35% 0 35% 0);
        opacity: 0.9;
      }
      86% {
        transform: translate(-7px, -3px);
        clip-path: inset(10% 0 65% 0);
        opacity: 0.9;
      }
      88% {
        transform: translate(5px, -1px);
        clip-path: inset(70% 0 15% 0);
        opacity: 0.8;
      }
      90% {
        transform: translate(-4px, 3px);
        clip-path: inset(25% 0 45% 0);
        opacity: 0.9;
      }
      92% {
        transform: translate(0, 0);
        clip-path: inset(0 0 0 0);
        opacity: 0;
      }
    }

    @keyframes pulse-sub {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; fill: #1A1A16; }
    }
  </style>

  <!-- RGB Split Glitch Layers -->
  <g transform="translate(400, 68)">
    <text class="glitch-text glitch-red">⚡ FELICH ⚡</text>
    <text class="glitch-text glitch-blue">⚡ FELICH ⚡</text>
    <text class="glitch-text base" filter="url(#glow)">⚡ FELICH ⚡</text>
  </g>

  <!-- Subtitle Tagline -->
  <text x="400" y="132" class="sub-text">SOFTWARE &amp; APPLIED AI PRODUCT ENGINEER • FELICH.DEV</text>
</svg>
